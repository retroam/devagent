[project]
name = "devcolor-agent"
version = "0.1.0"
description = "A command-line RAG agent that answers questions about /dev/color from a FAQ corpus."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic-ai",
    "sentence-transformers",
    "ddgs",
    "python-dotenv",
    "rich",
    "click",
]

[project.scripts]
devcolor-agent = "agent:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
